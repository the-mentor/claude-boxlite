name: cbox release

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cbox-linux-x86_64
          - os: macos-14
            asset: cbox-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # boxlite's build.rs compiles boxlite-shared, which requires protoc >= 3.12
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # boxlite's build.rs compiles boxlite-shared, which requires protoc >= 3.12
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Run cbox test suite
        working-directory: cbox
        run: cargo test --release

      - name: Build cbox
        working-directory: cbox
        run: cargo build --release

      - name: Rename binary to its asset name
        run: cp cbox/target/release/cbox ${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    concurrency:
      group: cbox-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cbox-linux-x86_64
          path: dist

      - name: Download macos artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cbox-macos-arm64
          path: dist

      - name: Resolve cbox version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' cbox/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::could not parse version from cbox/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish dev rolling release
        if: github.ref == 'refs/heads/dev'
        env:
          # Using the default GITHUB_TOKEN (not a PAT) is load-bearing: GitHub suppresses
          # workflow runs triggered by refs it creates, which is what stops this from
          # re-triggering the workflow it creates a tag in.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}-dev"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/cbox-linux-x86_64 dist/cbox-macos-arm64 \
            --title "cbox dev build" --prerelease --target "$GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/cbox-linux-x86_64 dist/cbox-macos-arm64 --generate-notes
