# Host-side agentgateway. Start with: just gateway-up
#
# All published ports bind 127.0.0.1 only, which keeps them off the LAN —
# but every running box reaches host loopback via host.boxlite.internal, so
# any port published here is reachable from every box, not just the host.
# See docs/design/agentgateway.md and the admin UI ports entry below.
services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.4.1
    container_name: agentgateway
    command: ["-f", "/config.yaml"]
    ports:
      - "127.0.0.1:15003:15003"   # MCP
      - "127.0.0.1:15002:15002"   # LLM routes
      # DANGER: agentgateway's built-in admin API (15001) is unauthenticated
      # — its /config_dump returns the live config with real credential
      # values, and it serves an unauthenticated POST /quitquitquit. Every
      # running box can reach any port published here via
      # host.boxlite.internal, so publishing this hands every box a way to
      # read secrets back out. This is NOT the admin UI (that's :15000
      # below, which is what you want). Uncomment only for temporary local
      # debugging with no untrusted box running, then remove it again.
      # - "127.0.0.1:15001:15001" # admin API — UNAUTHENTICATED, leaks real credentials to every running box; the admin UI you want is :15000 below
      #
      # Admin UI (15000) — on by default, behind basic auth (config.yaml's
      # `ui-gateway`/`ui:` blocks), so safe to publish even though every box
      # can reach it too. See README.md "Admin UI".
      - "127.0.0.1:15000:15000" # admin UI (password-protected)
    environment:
      # Required: binds the admin API off container-loopback (needed if the
      # :15001 publish above is ever uncommented) and avoids its default port
      # (15000) colliding with ui-gateway's — see docs/design/agentgateway.md.
      ADMIN_ADDR: 0.0.0.0:15001
      # May legitimately be empty: a subscription user has no API key, and the
      # /claude passthrough route does not need one.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Upstream for the /api keyed route only (config.yaml's `hostOverride`).
      # Must be host:port — no scheme, no path; a portless value crash-loops
      # the gateway, which is why the default below carries an explicit port.
      AGENTGATEWAY_ANTHROPIC_UPSTREAM_HOST: "${AGENTGATEWAY_ANTHROPIC_UPSTREAM_HOST:-api.anthropic.com:443}"
      # Bearer token agentgateway injects into every request to the `github`
      # MCP target (see config.yaml). May legitimately be empty — compose
      # must still start without a GH_TOKEN in .env, leaving a degraded
      # (401-ing) github target rather than a gateway crash. Falls back to
      # GITHUB_TOKEN; the trailing :- keeps this empty-but-present, never
      # unset, when neither is set.
      GH_TOKEN: "${GH_TOKEN:-${GITHUB_TOKEN:-}}"
    volumes:
      - ./config.yaml:/config.yaml:ro
      # Backs the admin UI's basic auth (config.yaml's `ui:` block). `just
      # gateway-up` copies htpasswd.default here on first run if missing, so
      # a fresh clone gets a working default login. Gitignored — never
      # commit this file, it's a live credential.
      - ./htpasswd:/etc/agentgateway/htpasswd:ro
      # Cost catalog for config.yaml's `config.modelCatalog`. Tracked in git
      # (holds no credential, unlike htpasswd) rather than generated at boot:
      # no new tooling, reviewable, user controls exact model ids. Tradeoff:
      # prices go stale and need manual updates.
      - ./model-costs.json:/etc/agentgateway/model-costs.json:ro
      # Backs config.yaml's `config.logging.database.url`. Named (not bind-
      # mounted) so `docker compose down` doesn't leave a root-owned file in
      # the repo checkout. Docker creates it root:root, but agentgateway runs
      # as UID 65532 — see agentgateway-logs-init below, which chowns it first.
      - agentgateway-logs:/var/lib/agentgateway
    restart: unless-stopped
    # github-mcp/jaeger: ordering only, not a correctness dependency (MCP
    # connects lazily, spans are fire-and-forget). agentgateway-logs-init IS
    # required — must complete first (see its comment below).
    depends_on:
      github-mcp:
        condition: service_started
      jaeger:
        condition: service_started
      agentgateway-logs-init:
        condition: service_completed_successfully

  # Chowns the volume to UID 65532 (agentgateway's non-root user) before it
  # starts — Docker creates named volumes root:root, and sqlx can't create
  # requests.db without write access. One-shot; exits before agentgateway starts.
  agentgateway-logs-init:
    image: busybox:1.37.0
    command: ["chown", "65532:65532", "/var/lib/agentgateway"]
    volumes:
      - agentgateway-logs:/var/lib/agentgateway

  # GitHub's official MCP server, run in HTTP mode as a sibling service.
  # agentgateway proxies to it by service name over the compose network (see
  # the `github` target in config.yaml) instead of GitHub's remote endpoint,
  # which this Docker host cannot reach at all.
  github-mcp:
    image: ghcr.io/github/github-mcp-server:v1.8.0
    container_name: github-mcp
    # --listen-host pinned explicitly rather than relying on the flag's
    # documented default, so this stays reachable across the compose network
    # regardless of upstream ever changing that default.
    command: ["http", "--port", "9090", "--listen-host", "0.0.0.0"]
    # No GITHUB_PERSONAL_ACCESS_TOKEN here — that's a stdio-mode credential;
    # this server ignores it in http mode and enforces its own OAuth layer
    # instead. The PAT lives on agentgateway's side (GH_TOKEN above,
    # injected as a Bearer header) — see docs/design/agentgateway.md.
    # Deliberately no `ports:` — reached only over the compose network by
    # service name. Do NOT publish a host port.
    restart: unless-stopped

  # OTLP-gRPC trace backend for config.yaml's `config.tracing`. all-in-one
  # accepts OTLP gRPC directly (COLLECTOR_OTLP_ENABLED below) — no separate
  # otel-collector needed.
  jaeger:
    # Jaeger v1 EOL'd 2025-12-31; 1.76.0 is its last tag. Pinned anyway — still
    # the simplest OTLP-gRPC-via-env-var option. v2 (jaegertracing/jaeger)
    # needs an OTel-Collector-style config and isn't a drop-in swap.
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    environment:
      # Enables OTLP gRPC on 4317 without a separate otel-collector.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # NOT 4317 — agentgateway reaches jaeger:4317 over the compose network
      # only; no box needs to send spans directly. 16686 (trace UI) is
      # published: read-only, no login, unlike the admin API above. But every
      # box can browse every OTHER box's request metadata here (models,
      # timing, gen_ai attributes) with none of the :15000 admin UI's auth —
      # no prompt/completion content, but cross-box metadata visibility.
      - "127.0.0.1:16686:16686" # Jaeger UI (read-only, no auth — see above)
    restart: unless-stopped

# Named volume backing config.yaml's `config.logging.database.url` — see the
# mount comment on `agentgateway` above for why named rather than bind-mounted.
volumes:
  agentgateway-logs:
