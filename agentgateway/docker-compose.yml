# Host-side agentgateway. Start with: just gateway-up
#
# All published ports bind 127.0.0.1 only, which keeps them off the LAN —
# but every running box reaches host loopback via host.boxlite.internal, so
# any port published here is reachable from every box, not just the host.
# See the admin-UI ports: entry below for why that matters.
services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.4.1
    container_name: agentgateway
    command: ["-f", "/config.yaml"]
    ports:
      - "127.0.0.1:3000:3000"   # MCP
      - "127.0.0.1:3001:3001"   # LLM routes
      # Admin UI (15000) is deliberately NOT published by default. Every
      # running box reaches host loopback via host.boxlite.internal, so
      # publishing this on 127.0.0.1 exposes it to every box, not just the
      # host — and it is unauthenticated. Its /config_dump endpoint returns
      # the live config with environment variables already expanded to their
      # real values, so a sandboxed box could read ANTHROPIC_API_KEY straight
      # back out of it; it also serves an unauthenticated POST /quitquitquit.
      # Uncomment only for temporary local debugging while no untrusted box
      # is running, then remove it again.
      # - "127.0.0.1:15000:15000" # admin UI
      #
      # Password-protected admin UI (15001) — OPT-IN, ships disabled. Unlike
      # the raw admin API above, this port serves the UI (config viewer +
      # MCP tool playground) behind HTTP basic auth (config.yaml's commented
      # `ui-gateway`/`ui:` blocks), so it stays safe to publish even though
      # every running box can also reach it via host.boxlite.internal — a
      # box without the password just gets a 401. Enable: run `just
      # gateway-ui-htpasswd`, uncomment this line, the matching volumes:
      # entry below, and the `ui-gateway`/`ui:` blocks in config.yaml, then
      # `just gateway-up` again. See README.md "Admin UI".
      # - "127.0.0.1:15001:15001" # admin UI (password-protected)
    environment:
      # Required, or the UI binds container-loopback and the published port is dead.
      ADMIN_ADDR: 0.0.0.0:15000
      # May legitimately be empty: a subscription user has no API key, and the
      # /claude passthrough route does not need one.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Upstream host for the /api keyed route only (config.yaml's `hostOverride`
      # on the claude-keyed backend) — lets a LiteLLM (or other Anthropic-Messages-
      # compatible) key route to something other than Anthropic directly. The
      # default here is what makes the var optional in .env: config.yaml requires
      # this to always resolve to something, so it must never reach the gateway
      # empty or unset.
      # Format is host:port, no scheme (not https://...) and no path — hostOverride
      # replaces only the authority, and a missing port or an added scheme/path
      # crash-loops the gateway. The default below carries an explicit port for
      # exactly this reason: a bare hostname with no port previously crash-looped.
      AGENTGATEWAY_ANTHROPIC_UPSTREAM_HOST: "${AGENTGATEWAY_ANTHROPIC_UPSTREAM_HOST:-api.anthropic.com:443}"
      # Bearer token agentgateway injects into every request to the `github`
      # MCP target (config.yaml's requestHeaderModifier on that target) —
      # github-mcp-server requires this on every HTTP-mode request, including
      # initialize, regardless of its own GITHUB_PERSONAL_ACCESS_TOKEN env var
      # (see config.yaml's header comment for why). May legitimately be empty:
      # compose must still start without a GH_TOKEN in .env — the github
      # target then sends a useless bearer value and github-mcp keeps
      # 401-ing, which is a degraded MCP target, not a gateway crash. Falls
      # back to GITHUB_TOKEN so a user who only sets that (as the box side
      # accepts) still gets a working github MCP target instead of a silent
      # 401; the trailing :- keeps this empty-but-present, never unset, when
      # neither is set.
      GH_TOKEN: "${GH_TOKEN:-${GITHUB_TOKEN:-}}"
    volumes:
      - ./config.yaml:/config.yaml:ro
      # Htpasswd file backing the password-protected admin UI above —
      # generate it with `just gateway-ui-htpasswd` (writes agentgateway/
      # htpasswd, gitignored — it's a credential, never commit it). Mounted
      # read-only at the path config.yaml's commented `ui:` block expects.
      # - ./htpasswd:/etc/agentgateway/htpasswd:ro
    restart: unless-stopped
    # Not a correctness dependency — agentgateway's MCP targets connect lazily,
    # so it starts fine before github-mcp is ready. This only orders `docker
    # compose up`/`down` so the two come and go together.
    depends_on:
      - github-mcp

  # GitHub's official MCP server image, run in HTTP mode as a sibling service.
  # agentgateway proxies to it by service name across the compose network
  # (see the `github` target in config.yaml) instead of GitHub's remote
  # endpoint, which the Docker host cannot reach at all (TLS handshake to
  # api.githubcopilot.com fails outside agentgateway too).
  github-mcp:
    image: ghcr.io/github/github-mcp-server:v1.8.0
    container_name: github-mcp
    # --listen-host is set explicitly rather than relying on the flag's
    # documented default (empty = all interfaces): pinning it to 0.0.0.0
    # keeps this reachable across the compose network regardless of upstream
    # ever changing that default.
    command: ["http", "--port", "9090", "--listen-host", "0.0.0.0"]
    # No GITHUB_PERSONAL_ACCESS_TOKEN here. That env var is a stdio-mode
    # credential; a live test proved this http-mode server ignores it
    # entirely and enforces its own OAuth layer on every request instead — a
    # bare curl with no Authorization header got a 401 on `initialize` with
    # the token set. The PAT lives on agentgateway's side instead (GH_TOKEN
    # above, injected as a Bearer header by config.yaml's `github` target
    # policies), so this service needs no GitHub credential of its own.
    # Deliberately no `ports:` here. agentgateway reaches this over the
    # compose network by service name/port alone, so this container stays
    # unreachable from the host entirely. Do NOT publish a host port.
    restart: unless-stopped
