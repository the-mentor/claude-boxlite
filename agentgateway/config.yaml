# WARNING: agentgateway's config loader expands every dollar-sign-plus-word
# token found anywhere in this file's raw text, including inside comments,
# and aborts the whole process if any one of them has no matching
# environment variable. No comment below may contain a dollar sign followed
# by a word — spell variable names out plainly (e.g. write GH_TOKEN, not a
# dollar-prefixed reference) or the gateway crash-loops on startup. This bit
# us once already; do not step on it again.
#
# The line 1 `yaml-language-server: schema=...` editor directive that used to
# open this file was removed for exactly this reason: the loader tried to
# resolve "schema" as an environment variable and crash-looped on it. Do not
# restore that directive.
#
# Host-side agentgateway for claude-boxlite.
# Secrets are environment-variable references only — never paste a literal
# credential here.
# This file is tracked in git.
#
# Schema check (v1.4.1, /tmp/agw-schema.json, defs.LocalMcpTarget): a remote
# target is `targets[].mcp.{host}` or `targets[].mcp.{host,port,path}` —
# `unevaluatedProperties: false` on that object rules out a bare `url:` or a
# `headers:` map (both used by the pre-schema-check draft of this file).
# Bearer-token injection instead goes through the per-target
# `policies.requestHeaderModifier.set` map (defs.SimpleLocalBackendPolicies),
# the same mechanism the upstream traffic-aws-agentcore example uses for a
# static auth header.
#
# NOT confirmed by the schema: whether the single-string `host` field parses
# a path out of a full URL (its own examples only show a bare origin or a
# bare `host:port`), or how backend TLS gets enabled for the `host+port+path`
# form (no scheme/tls field exists on that variant; defs.LocalBackendTLS is
# all-optional tuning knobs, not an on/off switch). Kept the original full
# URL string under the corrected `host` key as the minimal fix. If Task 6's
# live run gets a TLS or 404-on-path error here, retry with the explicit
# `host: api.githubcopilot.com` / `port: 443` / `path: /mcp/` form plus
# `policies.backendTLS: {}`.
#
# ALSO NOT confirmed: whether the GH_TOKEN reference on the Authorization
# header below is actually expanded at runtime. Upstream only documents
# environment-variable expansion for `apiKey`-style fields; the
# traffic-aws-agentcore example that corroborates the
# `requestHeaderModifier.set` key path uses a hardcoded literal header value
# ("user-foo"), not an environment-variable reference, so it proves the key
# path only, not expansion. This could NOT be exercised in Task 6's run: the
# environment cannot complete a TLS handshake to api.githubcopilot.com at
# all, with or without agentgateway in front of it, so no request ever got
# far enough to reveal whether the header was expanded or sent literally.
# Still an open risk, not confirmed fine — untested for an environmental
# reason, not because it passed. If a future environment can reach GitHub,
# check agentgateway's startup/debug logs for the resolved header, or make an
# authenticated call through the GitHub MCP target, not just confirm the
# listener answers.

mcp:
  port: 3000
  targets:
    # GitHub's remote MCP server. Set GH_TOKEN in .env to use it (not yet
    # present there as of this writing).
    - name: github
      mcp:
        host: https://api.githubcopilot.com/mcp/
      policies:
        requestHeaderModifier:
          set:
            Authorization: "Bearer $GH_TOKEN"

    # --- Not enabled. These are stdio servers and this container has no node/uv,
    # --- so each needs a sibling compose service running its official image over
    # --- HTTP, with the target below pointing at it across the compose network.
    # --- Field name corrected to `mcp.host` (not `mcp.url`) to match the live
    # --- `github` target above — see the file header comment: the schema's
    # --- LocalMcpTarget has `unevaluatedProperties: false` and rejects a bare
    # --- `url:` key, so `url:` here would fail validation the moment it's
    # --- uncommented.
    #
    # Terraform — image: hashicorp/terraform-mcp-server (supports streamable HTTP)
    # - name: terraform
    #   mcp:
    #     host: http://terraform-mcp:8080/mcp
    #
    # Playwright — image: mcr.microsoft.com/playwright/mcp
    # Keeps browsers off both the host and the VM.
    # - name: playwright
    #   mcp:
    #     host: http://playwright-mcp:8931/mcp
    #
    # Fetch — no official image. Run `uvx mcp-server-fetch` on the host and point
    # at it, or drop this target entirely.
    # - name: fetch
    #   mcp:
    #     host: http://host.docker.internal:8000/mcp

# LLM routes (Task 2). Schema check (v1.4.1, /tmp/agw-schema.json +
# schema/config.md rendered from it): top level is `binds[].listeners[].routes[]`,
# same shape already confirmed valid for `mcp:` targets in Task 1.
#
# `policies.ai.routes` and `policies.backendAuth` are each schema-valid in TWO
# places: at the route level (`routes[].policies.*`) and nested inside the ai
# backend (`routes[].backends[].ai.policies.*`) — `LocalBackendPolicies` is the
# same type reused in both spots. The brief's candidate put `ai.routes` under
# the backend and `backendAuth` on the route; both were verified schema-valid
# as written, so nothing needed to move. This split also matches agentgateway's
# own published examples verbatim: the Claude Desktop and Claude Code
# integration docs (agentgateway.dev/docs/standalone/*/integrations/llm-clients/
# claude-desktop and .../claude-code, fetched for this task) both nest
# `policies.ai.routes` under `backends[].ai`. A third-party blog
# (maniak.io/articles/2026-05-08-claude-codex-passthrough-through-agentgateway)
# places `backendAuth` as a bare top-level key on the route (sibling of
# `matches`/`policies`/`backends`) — that key does not exist on `LocalRoute`
# (`additionalProperties: false`, only name/namespace/ruleName/hostnames/
# matches/policies/backends) and was NOT followed; `backendAuth` stays inside
# `policies:` per the schema.
#
# CONFIRMED (Task 6, off-stack): environment-variable expansion of
# `policies.backendAuth.key` works. Unsetting ANTHROPIC_API_KEY made the
# gateway fail at startup with an environment-variable-not-found error for
# that name, and with it set, the outbound request carried the real value.
# This was previously unconfirmed by the schema alone: the field's type is
# `FileOrInline` = `{file: string} | string`, which documents no expansion
# behavior on the type itself, and upstream's own docs only demonstrate this
# expansion for the *shorthand* `llm.models[].params.apiKey` field (e.g. in
# examples/llm-basic/config.yaml and the Anthropic provider doc) — a
# different field on a different config shape (`llm:` top-level shorthand,
# not the `binds:`/`backendAuth` long form used here). The mechanism turns
# out to be the same underneath either way: the loader expands
# environment-variable references anywhere in the raw file text, including,
# disastrously, inside comments — see the warning at the top of this file.
binds:
  - port: 3001
    listeners:
      - routes:
          # Subscription OAuth. NO credential block — that absence is what makes
          # this passthrough: Claude Code's own OAuth token and its
          # anthropic-beta: oauth-2025-04-20 header travel upstream untouched.
          # Client sets ANTHROPIC_BASE_URL=http://host.boxlite.internal:3001/claude
          - matches:
              - path:
                  pathPrefix: /claude
            policies:
              urlRewrite:
                path:
                  prefix: /
            backends:
              - ai:
                  name: claude-passthrough
                  provider:
                    anthropic: {}
                  policies:
                    ai:
                      routes:
                        /v1/messages: messages
                        /v1/messages/count_tokens: anthropicTokenCount
                        '*': passthrough

          # API key. The gateway attaches the real credential; the box sends a
          # dummy ANTHROPIC_AUTH_TOKEN and never sees the key.
          # Client sets ANTHROPIC_BASE_URL=http://host.boxlite.internal:3001/api
          - matches:
              - path:
                  pathPrefix: /api
            policies:
              urlRewrite:
                path:
                  prefix: /
              backendAuth:
                key: "$ANTHROPIC_API_KEY"
            backends:
              - ai:
                  name: claude-keyed
                  provider:
                    anthropic: {}
                  policies:
                    ai:
                      routes:
                        /v1/messages: messages
                        /v1/messages/count_tokens: anthropicTokenCount
                        '*': passthrough
